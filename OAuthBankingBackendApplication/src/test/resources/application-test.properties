# ---------------------------------------------------------------------------
# Test profile: in-memory H2, schema built from the entities.
#
# This exists so the test suite never needs a running MySQL server. Overrides
# in here beat src/main/resources/application.properties.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:bankingbackend;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate builds the schema from the entity mapping, then data.sql seeds it.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

# A fixed secret so tokens are reproducible across runs.
JWT_SECRET=integration-test-secret-value-long-enough-for-hs256

app.cors.allowed-origins=http://localhost:4200

logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

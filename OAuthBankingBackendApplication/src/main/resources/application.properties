# ---------------------------------------------------------------------------
# Default profile - local development
#
# Profile-specific overrides live in application-prod.properties. Spring Boot
# loads that file automatically whenever the "prod" profile is active, so the
# previous spring.config.import / spring.config.activate.on-profile pair is no
# longer needed. The old application_prod.properties (underscore) must be
# deleted; Boot only recognises the hyphenated application-{profile} form.
# ---------------------------------------------------------------------------
spring.application.name=OAuthBankingBackendApplication

# --- Datasource ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:bankingbackend}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password1234}

# --- JPA -------------------------------------------------------------------
# The schema is managed by docs/db/schema.sql, not by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

# --- Security --------------------------------------------------------------
# HMAC signing secret. At least 32 characters, so HS256 gets a 256-bit key.
# Leave unset locally to use the built-in development default; the application
# refuses to start under the prod profile while that default is still in use.
# JWT_SECRET=change-me-to-a-long-random-value

# Origins allowed to call the API from a browser.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Logging ---------------------------------------------------------------
# TRACE on the security package is useful while learning the filter chain but
# prints the whole chain on every request; DEBUG is the sane default.
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:DEBUG}

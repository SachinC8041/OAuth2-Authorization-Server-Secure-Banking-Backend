spring.config.activate.on-profile=prod

spring.application.name=OAuthBankingBackendApplication
#spring.security.user.name =${SECURITY_USERNAME:sachin}
#spring.security.user.password=${SECURITY_PASSWORD:password1234}

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:bankingbackend}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password1234}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
#logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE} // for Default level
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:ERROR}

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

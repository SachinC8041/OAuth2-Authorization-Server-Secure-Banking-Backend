# ---------------------------------------------------------------------------
# Production profile: activate with --spring.profiles.active=prod
#
# Everything here is required to come from the environment. There are no usable
# defaults on purpose - a missing value should stop the application from
# starting rather than silently fall back to a development setting.
# ---------------------------------------------------------------------------

# --- Datasource ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT:3306}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# --- JPA -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Security --------------------------------------------------------------
# Required. JwtService throws at startup if this is absent under this profile.
# HTTPS is enforced for every request when this profile is active.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Logging ---------------------------------------------------------------
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:WARN}
logging.level.com.example.OAuthBankingBackendApplication=${APP_LOG_LEVEL:INFO}
